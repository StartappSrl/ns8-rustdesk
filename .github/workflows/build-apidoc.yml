name: "Build API JSON Schema docs"

on:
  push:
    paths:
      - '**/validate-input.json'
      - '**/validate-output.json'
      - '**/validator-definitions.json'

# The shared workflow pushes the docs to the apidoc-<ref> branch. The
# repository default token is read-only: without this, the run fails at
# startup.
permissions:
  contents: write

jobs:
  build-apidoc:
    uses: NethServer/ns8-github-actions/.github/workflows/build-apidoc.yml@v1
