# Categories for the automatically generated release notes
# (gh release create --generate-notes, or the button in the GitHub UI)
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New features
      labels: [enhancement, feature]
    - title: Bug fixes
      labels: [bug, fix]
    - title: Container image updates
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
